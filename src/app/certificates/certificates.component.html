<div class="card my-3 p-3 shadow-sm rounded-3">
  <h4 class="fw-bold mb-3">Certificates</h4>

  <div *ngIf="certificates.length; else noCert">
    <div *ngFor="let cert of certificates" class="mb-3 pb-2 border-bottom">
      <h6 class="fw-bold mb-1">{{ getCertificateTitle(cert) }}</h6>
      <p class="text-muted small mb-2" *ngIf="cert.institution">{{ cert.institution }}</p>

      <a
        *ngIf="getCertificateUrl(cert) as certUrl"
        [href]="certUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-outline-primary btn-sm rounded-pill w-100"
        [attr.aria-label]="'Ver certificado de ' + getCertificateTitle(cert)"
      >
        Ver credencial
      </a>
    </div>
  </div>

  <ng-template #noCert>
    <p class="text-muted small mb-0">No hay certificados registrados.</p>
  </ng-template>
</div>
